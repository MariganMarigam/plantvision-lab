# PlantVision capture configuration (Stage 2; consumed by capture_once + systemd timer).
# Photoperiod per decision D8: RGB frames in the dark are unusable for growth metrics.

camera_id: phone-01
zone_id: shelf-a/tray-1

# IP Webcam snapshot endpoint. PLACEHOLDER: must be replaced by the phone's actual
# LAN address before any real capture (user-provided; not derivable from code).
source_url: "http://<phone-ip>:8080/photo.jpg"

# Cadence (decision D3): one frame every 10 minutes (decision D3); the systemd timer owns the firing.
interval_minutes: 10

# Single-attempt HTTP timeout / retry schedule for a failed pull.
# 10-min cadence (D3): worst-case failed run ~5s timeout + 2s + 5s backoffs ≈ 12 s,
# negligible against the 10-min interval.
timeout_seconds: 5
retry_max: 2
retry_backoff_seconds: [2, 5]

# Target capture resolution (IP Webcam may serve near this; stored as-is).
resolution: [1280, 720]

# Originals + spool (relative to repo root / systemd WorkingDirectory; gitignored).
originals_dir: data/originals
spool_dir: data/spool
log_path: data/capture.log

# Photoperiod light window. "local" = system timezone (DST-aware) or a ZoneInfo name
# e.g. "Europe/Berlin". Start inclusive, end exclusive ("06:00" <= time < "22:00").
# If this key is absent, capture_once falls back to the same 06:00-22:00 default.
light_window:
  start: "06:00"
  end: "22:00"
  tz: "local"

# Frames outside the light window:
#   skip = do not capture at all (no fetch, no file; run exits skipped_dark / exit 0)
#   tag  = capture anyway and mark the frame quality="dark" (unusable for growth metrics)
dark_policy: skip


# -- Offline import (USB folder copy) - scripts/import_offline.py -------------
# The phone stores frames locally while the PC is off; the folder is copied over
# later and ingested here. Frames land in the SAME originals tree as the pull path,
# so the flywheel (scripts/update_metrics.py) measures them with no changes.
# Thresholds below are IMPORT-side only; none of them change measurement code.
import:
  extensions: [".jpg", ".jpeg"]   # matched case-insensitively; anything else => skipped_unsupported
  brightness_min: 40.0            # gray mean below => skipped_dark (reason: brightness); aligned with pipeline quality.brightness_min
  brightness_max: 220.0           # gray mean above => "bright" flag only (never skipped)
  blur_lapvar_min: 10.0           # Laplacian variance below => "blur" flag only (never skipped)
  red_dominance_min: 1.5          # mean(R)/mean(G) >= this => "red" flag only (never skipped).
                                  # Evidence 2026-10-17, 69 baseline frames under white light:
                                  # red_dominance range 0.89-1.44 (median 1.11), so 1.5 does not
                                  # false-flag them; re-measure under the red grow lamp and lower
                                  # it only if genuinely red-lit frames still pass unflagged.
  archive_subdir: "_imported"     # --move destination, relative to --source (never re-scanned)
