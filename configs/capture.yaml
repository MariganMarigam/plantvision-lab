# PlantVision capture configuration (Stage 2; consumed by capture_once + systemd timer).
# Photoperiod per decision D8: RGB frames in the dark are unusable for growth metrics.

camera_id: phone-01
zone_id: shelf-a/tray-1

# IP Webcam snapshot endpoint. PLACEHOLDER: must be replaced by the phone's actual
# LAN address before any real capture (user-provided; not derivable from code).
source_url: "http://192.168.1.50:8080/photo.jpg"

# Cadence (decision D3): one frame every 10 minutes; the systemd timer owns the firing.
interval_minutes: 10

# Single-attempt HTTP timeout / retry schedule for a failed pull.
timeout_seconds: 10
retry_max: 5
retry_backoff_seconds: [2, 5, 15, 60, 300]

# Target capture resolution (IP Webcam may serve near this; stored as-is).
resolution: [1280, 720]

# Originals + spool (relative to repo root / systemd WorkingDirectory; gitignored).
originals_dir: data/originals
spool_dir: data/spool
log_path: data/capture.log

# Photoperiod light window. "local" = system timezone (DST-aware) or a ZoneInfo name
# e.g. "Europe/Berlin". Start inclusive, end exclusive ("06:00" <= time < "22:00").
# If this key is absent, capture_once falls back to the same 06:00-22:00 default.
light_window:
  start: "06:00"
  end: "22:00"
  tz: "local"

# Frames outside the light window:
#   skip = do not capture at all (no fetch, no file; run exits skipped_dark / exit 0)
#   tag  = capture anyway and mark the frame quality="dark" (unusable for growth metrics)
dark_policy: skip
