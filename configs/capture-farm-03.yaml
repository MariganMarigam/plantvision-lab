# PlantVision capture configuration for the FARM-03 dataset (offline import only).
# Third farm rig: lettuce in zone C, 1280x720 portrait, Open Camera auto-repeat,
# ArUco DICT_5X5_50 marker id 2. A distinct camera_id/zone from farm-01/farm-02
# keeps these frames out of the earlier metrics stores and galleries.
# Used by scripts/import_offline.py --config.

camera_id: farm-03
zone_id: farm/zone-c
crop_id: lettuce

# Not used by the offline import path (the phone stores frames itself). Kept for
# schema compatibility with capture.yaml.
source_url: "http://<phone-ip>:8080/photo.jpg"

# Cadence used on the phone (Open Camera auto-repeat). Informational for import.
interval_minutes: 5

timeout_seconds: 5
retry_max: 2
retry_backoff_seconds: [2, 5]

# Farm-03 frames are 1280x720 (portrait), captured 2026-10-28..2026-11-01.
resolution: [1280, 720]

originals_dir: data/originals
spool_dir: data/spool
log_path: data/capture.log

# Farm photoperiod (same schedule as farm-01/farm-02).
light_window:
  start: "06:00"
  end: "22:00"
  tz: "local"

dark_policy: skip

# -- Offline import (USB folder copy) - scripts/import_offline.py -------------
# Identical thresholds to capture-farm.yaml / capture-farm-02.yaml.
import:
  extensions: [".jpg", ".jpeg"]
  brightness_min: 40.0
  brightness_max: 220.0
  blur_lapvar_min: 10.0
  # Lettuce under blurple: frames may carry the informational "red" flag
  # (never skipped).
  red_dominance_min: 1.5
  archive_subdir: "_imported"
