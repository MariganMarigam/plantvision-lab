# PlantVision capture configuration for the FARM-04 dataset (offline import only).
# Fourth farm rig: lettuce in zone D, 1280x720 portrait, Open Camera auto-repeat,
# ArUco DICT_5X5_50 marker id 2. One observation unit observed across a light
# change: this config covers the white-light side (switch on 2026-11-05).
# Used by scripts/import_offline.py --config.

camera_id: farm-04
zone_id: farm/zone-d
crop_id: lettuce
light_regime: white

# Not used by the offline import path (the phone stores frames itself). Kept for
# schema compatibility with capture.yaml.
source_url: "http://<phone-ip>:8080/photo.jpg"

# Cadence used on the phone (Open Camera auto-repeat). Informational for import.
interval_minutes: 5

timeout_seconds: 5
retry_max: 2
retry_backoff_seconds: [2, 5]

# Farm-04 frames are 1280x720 (portrait), captured 2026-11-05..2026-11-07.
resolution: [1280, 720]

originals_dir: data/originals
spool_dir: data/spool
log_path: data/capture.log

# Farm photoperiod (same schedule as farm-01/farm-02/farm-03).
light_window:
  start: "06:00"
  end: "22:00"
  tz: "local"

dark_policy: skip

# -- Offline import (USB folder copy) - scripts/import_offline.py -------------
# Identical thresholds to capture-farm.yaml / capture-farm-02.yaml / farm-03.
import:
  extensions: [".jpg", ".jpeg"]
  brightness_min: 40.0
  brightness_max: 220.0
  blur_lapvar_min: 10.0
  # Informational only: white-light lettuce does not trip the red flag normally.
  red_dominance_min: 1.5
  archive_subdir: "_imported"
