[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plantvision"
version = "0.0.0"
description = "Phone-camera -> Ubuntu CV pipeline for leafy-green growth monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/plantvision"]
